# MyLinux section configuration
[sections]
rodata_prefix=.rodata.mylinux
data_prefix=.data.mylinux
bss_prefix=.bss.mylinux
metadata_prefix=.mylinux.metadata

[architecture]
primary=aarch64
pointer_width=64
endianness=little
code_alignment=4
data_alignment=8

[linker]
retain_metadata=true
retain_all_sections=false
use_insert_directive=true
validate_generated_script=true
generated_output=build-output-only

[validation]
check_symbols=true
check_alignment=true
check_duplicates=true
check_writable_metadata=true
check_section_sizes=true

[release]
production_ready=false
review_required=true
