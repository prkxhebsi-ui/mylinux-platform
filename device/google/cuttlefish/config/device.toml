# MyLinux Homemade Cuttlefish
# Native Termux device manager - no QEMU required

[device]
name = "MyLinux Homemade Cuttlefish"
id = "mylinux-cuttlefish-arm64"
manufacturer = "MyLinux"
architecture = "aarch64"
version = "1.0"
device_type = "native-manager"

[host]
operating_system = "Android"
environment = "Termux"
display_server = "Termux:X11"
display_number = ":1"
kvm_required = false
qemu_required = false

[gui]
toolkit = "tkinter"
theme = "clam"
window_width = 1000
window_height = 700
resizable = true

[monitoring]
cpu_monitoring = true
memory_monitoring = true
process_monitoring = true
refresh_interval = 2

[database]
engine = "sqlite3"
path = "database/devices.db"

[network]
enabled = true
management_server = false
management_host = "127.0.0.1"
management_port = 8765
tls_enabled = false

[storage]
package_directory = "packages"
report_directory = "reports"
temporary_directory = "tmp"
log_directory = "logs"

[security]
verify_package_hashes = true
allow_remote_management = false
require_tls_for_remote = true

[emulator]
enabled = false
accelerator = "none"
