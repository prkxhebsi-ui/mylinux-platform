luni.name=MyLinux Luni
luni.version=1.0.0
luni.api=30
luni.architecture=arm64

luni.java.source=8
luni.java.encoding=UTF-8

luni.runtime.enabled=true
luni.runtime.android_compatibility=true
luni.runtime.openjdk_integration=true

luni.environment.file=environment/mylinux.envs
luni.metadata.file=config/luni.json

luni.logging.enabled=true
luni.logging.level=INFO

luni.security.strict=true
luni.io.enabled=true
luni.network.enabled=true
luni.time.enabled=true
