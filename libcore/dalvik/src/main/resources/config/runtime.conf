# MyLinux Dalvik runtime configuration

runtime.name=MyLinux Dalvik
runtime.version=1.0.0
runtime.config_version=1

runtime.dex.library=prebuilts/lib/libdex.so
runtime.dex.enabled=true

runtime.vm.enabled=false
runtime.vm.interpreter=dalvik

runtime.tools.directory=prebuilts/bin
runtime.jmods.directory=prebuilts/java/jmods

runtime.logging.enabled=true
runtime.logging.level=INFO
