# MyLinux platform configuration.
# This file is declarative and does not enforce settings by itself.

[platform]
name=MyLinux
android_base=11
api_level=30
architecture=arm64
abi=aarch64
development_status=true

[runtime]
name=MyLinuxRuntime
metadata_enabled=true
diagnostics_enabled=true
debugging_enabled=false
logging_enabled=true
strict_configuration=true

[build]
compiler=clang
language=c11
warnings=enabled
tests=separate
optimization=target-dependent
position_independent=target-dependent
reproducible_builds=desired

[metadata]
format=key-value
encoding=utf-8
version=1
case_sensitive=true
allow_duplicate_keys=false
validate_before_use=true

[security]
policy_owner=platform
kernel_enforcement=true
audit_enabled=true
least_privilege=true
do_not_infer_privileges_from_metadata=true

[diagnostics]
crash_reports=optional
stack_traces=optional
memory_statistics=optional
thread_statistics=optional
sensitive_data_redaction=required
log_destination=platform-managed

[compatibility]
android_api=30
native_abi=aarch64
public_headers=explicit
private_headers=internal
vendor_boundary=preserved
system_partition=preserved

[storage]
configuration_path=/system/etc/mylinux
metadata_path=platform-defined
mutable_runtime_state=external-service
persistent_state=explicitly-configured

[validation]
configuration_required=true
unknown_keys=reject-in-strict-mode
missing_required_values=error
invalid_boolean_values=error
invalid_encoding=error
duplicate_sections=reject
duplicate_keys=reject

[release]
production_ready=false
security_review_required=true
integration_tests_required=true
upstream_aosp_merge_required=true
release_signing_required=true
